<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e7">
<title>Coincasa — каталог</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e7;--card:#fcf9f4;--ink:#3b2f27;--mute:#8a7968;--line:#e6dccd;--acc:#4a3a2f;--acc2:#eee4d5;--red:#b5705a;--ok:#7d6b50;--cocoa:#6b4f3a;--camel:#b08a62}
@media (prefers-color-scheme:dark){:root{--bg:#1f1a16;--card:#2a231d;--ink:#efe6da;--mute:#a8998a;--line:#3a3028;--acc:#efe6da;--acc2:#2f2721;--red:#d98b72;--ok:#c2a77f;--cocoa:#a67c5b;--camel:#c9a273}.ph img,.ci .circ img,.pics .a img,.fi img{mix-blend-mode:normal!important;background:#fff!important;filter:none!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Barlow,Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.site-head{position:sticky;top:0;z-index:20;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;height:72px}
.nav{display:flex;gap:26px;align-items:center}
.nav a,#burger{color:var(--ink);font-size:15px;letter-spacing:.06em;cursor:pointer;opacity:.9;text-decoration:none}
.nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:6px}
#burger{display:none;border:0;background:none;font:inherit;padding:0}
.site-head .logo{font-size:26px;letter-spacing:.34em;font-weight:500;cursor:pointer;text-align:center;padding-left:.34em}
.site-head .logo span{font-weight:300;color:var(--mute)}
.hr{display:flex;justify-content:flex-end}
.logo{font-weight:600;font-size:18px;letter-spacing:.14em;white-space:nowrap}
.searchbar{max-width:680px;margin:20px auto 0;padding:0 16px}
#q{width:100%;padding:13px 20px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.hero{text-align:center;padding:46px 16px 8px}
.hero h1{margin:0;font-weight:300;font-size:44px;letter-spacing:.06em}
.hero p{margin:8px 0 0;color:var(--mute);letter-spacing:.04em}
.bn{max-width:1240px;margin:22px auto 0;padding:0 28px;position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;min-height:400px;padding:0 56px;gap:20px;background:linear-gradient(120deg,var(--b1),var(--b2));overflow:hidden}
.slide .tx small{display:block;letter-spacing:.3em;font-size:12px;text-transform:uppercase;opacity:.7;margin-bottom:14px}
.slide h2{margin:0;font:600 54px/1.05 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em;color:var(--ink)}
.slide p{margin:16px 0 26px;font-size:17px;color:#6b5a4b;max-width:420px}
.slide .go{display:inline-block;padding:14px 30px;border-radius:99px;background:var(--cocoa);color:#fff;font-size:15px;letter-spacing:.04em;cursor:pointer}
.slide .go:hover{filter:brightness(.88)}
.pics{display:flex;justify-content:center;align-items:flex-end;gap:14px;height:340px}
.pics .a{width:30%;background:#fbf5ec;border-radius:999px 999px 10px 10px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.14);height:78%}
.pics .a:nth-child(2){height:100%}
.pics .a img{width:100%;height:100%;object-fit:contain;padding:10%;mix-blend-mode:multiply}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer;transition:.2s}
.dots i.on{background:var(--ink);width:22px;border-radius:8px}
.cats{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;max-width:1240px;margin:30px auto 8px;padding:0 28px}
.ci{width:108px;text-align:center;cursor:pointer}
.ci .circ{width:108px;height:108px;border-radius:50%;background:var(--acc2);overflow:hidden;position:relative;transition:.2s}
.ci .circ img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%;background:transparent;mix-blend-mode:multiply}
.ci:hover .circ{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.1)}
.ci span{display:block;margin-top:10px;font-size:14px;line-height:1.25}
.sec{max-width:1240px;margin:46px auto 0;padding:0 28px}
.sec .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:12px}
.sec h2{font-weight:300;font-size:28px;letter-spacing:.04em;margin:0}
.sec .all{font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:5px;cursor:pointer;white-space:nowrap}
.sale{max-width:1240px;margin:46px auto 0;padding:0 28px}
.sale h2{font-weight:300;font-size:28px;letter-spacing:.04em;margin:0 0 16px}
#sections{padding-bottom:70px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:210px;gap:16px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:24px;max-width:1400px;margin:0 auto;padding:20px 16px 16px}
aside{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 104px);overflow:auto;padding-right:6px}
aside h4{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.cat{display:flex;align-items:center;gap:4px;padding:6px 10px 6px 4px;border-radius:8px;cursor:pointer}
.cat .cn{flex:1}
.chv{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;border-radius:6px;flex:none}
.chv.tg:hover{background:var(--line);color:var(--ink)}
.cat:hover{background:var(--acc2)}
.cat.on{background:var(--acc2);font-weight:600}
.cat small{opacity:.7}
.sub{margin-left:26px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border:1px solid var(--line);border-radius:99px;cursor:pointer;background:var(--card);font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.row{display:flex;gap:6px}
.row input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label.ck{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.top select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
#crumb{color:var(--mute)}
#crumb b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ph{aspect-ratio:1/1;background:var(--acc2);display:flex;align-items:center;justify-content:center;position:relative;color:var(--mute);font-size:13px;letter-spacing:.2em;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;background:transparent;mix-blend-mode:multiply}
.ph.has>span:not(.badge):not(.pb){display:none}
.thumbs{display:flex;gap:6px;margin-top:8px;position:absolute;left:8px;bottom:8px;right:8px;z-index:3}
.thumbs img{position:static;width:54px;height:54px;object-fit:contain;border:2px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.thumbs img.on{border-color:var(--acc)}
.mbox .ph{padding-bottom:70px}
.btn.main{display:block}
.badge{position:absolute;top:8px;right:8px;background:var(--red);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;z-index:5;letter-spacing:.02em}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:500;line-height:1.3}
.it{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{font-size:16px;font-weight:600}
.pr s{color:var(--mute);font-size:13px}
.st{font-size:12px;color:var(--ok)}
.st.no{color:var(--mute)}
#more{display:block;margin:24px auto;padding:12px 28px;border:1px solid var(--line);color:var(--ink);background:none;border-radius:10px;font:inherit;cursor:pointer}
.empty{padding:60px;text-align:center;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.mbox{background:var(--card);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.mbox .ph{aspect-ratio:auto;min-height:300px}
.mi{padding:22px;position:relative}
.mi h2{margin:0 0 4px;font-size:20px}
.x{position:absolute;right:12px;top:8px;border:0;background:none;color:var(--mute);font-size:28px;cursor:pointer}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0}
dt{color:var(--mute)}dd{margin:0}
.big{font-size:26px;font-weight:700}
.fab,.mh,.showbar,.mx{display:none}
*{-webkit-tap-highlight-color:transparent}
@media(max-width:820px){
 body{font-size:15px}
 .site-head{padding:0 12px;height:60px;grid-template-columns:1fr auto 1fr}
 .nav a#navHome{display:none}
 .nav a{font-size:14px}
 .site-head .logo{font-size:18px;letter-spacing:.22em}
 #favBtn{padding:7px 12px}.w{display:none}
 .searchbar{margin-top:12px;padding:0 12px}
 #q,.row input,.top select{font-size:16px}
 #q{padding:12px 18px}
 .hero{padding:28px 16px 0}.hero h1{font-size:30px}
 .bn{padding:0 12px;margin-top:14px}
 .slides{border-radius:18px}
 .slide{grid-template-columns:1fr;min-height:0;padding:26px 20px 22px;gap:10px;text-align:center}
 .slide h2{font-size:36px}.slide p{margin:10px auto 18px;font-size:15px}
 .slide .go{padding:12px 26px}
 .pics{height:190px;gap:10px}
 .cats{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;gap:16px;padding:0 16px 8px;margin-top:22px;scrollbar-width:none}
 .cats::-webkit-scrollbar{display:none}
 .ci{width:84px;flex:none}.ci .circ{width:84px;height:84px}.ci span{font-size:12.5px}
 .sec{padding:0 16px;margin-top:34px}.sec h2{font-size:23px}
 .sale{padding:0 16px;margin-bottom:40px}.sale h2{font-size:24px}.strip{grid-auto-columns:160px;gap:12px}
 .wrap{grid-template-columns:1fr;padding:12px 12px 90px}
 aside{display:none;position:fixed;inset:0;max-height:none;background:var(--bg);z-index:70;padding:0 16px 96px;overflow:auto}
 aside.on{display:block}
 .mh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:18px}
 .mh .x{position:static;font-size:30px;line-height:1}
 .showbar{display:block;position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
 .showbar .btn.main{width:100%;background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500;padding:14px;font-size:16px}
 .fab{display:flex;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:13px 24px;font:500 15px Barlow,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28)}
 .grid{grid-template-columns:repeat(2,1fr);gap:10px}
 .body{padding:8px 10px 10px}.nm{font-size:14px}.pr b{font-size:15px}
 .heart{width:36px;height:36px;top:6px;left:6px}
 .badge{top:6px;right:6px;font-size:12px;padding:2px 9px}
 .top{margin-bottom:10px}#crumb{font-size:14px}
 #modal.on{align-items:flex-end;padding:0}
 .mbox{grid-template-columns:1fr;border-radius:20px 20px 0 0;max-height:94vh}
 .mbox .ph{min-height:340px}
 .mi{padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
 .mi .x{display:none}
 .mx{display:block;position:sticky;top:10px;justify-self:end;margin:10px 12px -46px 0;height:36px;width:36px;border-radius:50%;background:rgba(255,255,255,.92);font-size:24px;line-height:36px;padding:0;z-index:6;color:#23201c;right:auto}
 #drawer{width:100%}
 #ff{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
}
.heart{position:absolute;top:8px;left:8px;z-index:4;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#23201c;font-size:18px;line-height:34px;cursor:pointer;padding:0}
.heart.on{color:var(--red)}
#favBtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;cursor:pointer;white-space:nowrap}
#favBtn b{font-weight:600}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:60;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer header{position:static;justify-content:space-between}
#fl{flex:1;overflow:auto;padding:8px 16px}
.fi{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.fi img,.fi .nop{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px}
.fi .nop{background:var(--acc2)}
.fi .t{font-weight:500;line-height:1.3}.fi .s{font-size:12px;color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:26px;height:26px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.fi .rm{border:0;background:none;color:var(--mute);cursor:pointer;font-size:20px}
#ff{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
#ff .tot{display:flex;justify-content:space-between;font-size:16px}
.btn{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-align:center;text-decoration:none}
.btn.main{background:var(--cocoa);border-color:var(--cocoa);color:#fff;font-weight:600}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
#veil.on{display:block}
.add{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-weight:500;cursor:pointer}
.add:disabled{background:var(--acc2);border-color:var(--line);color:var(--mute);cursor:default}
.stp{display:flex;align-items:center;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.stp button{width:46px;height:40px;border:0;background:var(--acc2);font-size:20px;cursor:pointer;color:var(--ink)}
.stp button:disabled{opacity:.35;cursor:default}
.stp b{flex:1;text-align:center}
.qty{flex-wrap:wrap}.qty b{min-width:18px;text-align:center}
.qty button:disabled{opacity:.35}
#prog{margin:14px 0 4px}
.pgt{font-size:14px;margin:0 0 8px}.pgt.okk{color:var(--cocoa);font-weight:500}
.pg{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.pg i{display:block;height:100%;background:var(--camel);transition:.3s}
#co h3,#done h3{font:500 22px/1.2 Barlow,sans-serif;margin:22px 0 4px}
.fl{display:block;font-size:13px;color:var(--mute);margin:14px 0 5px}
#co input[type=text],#co input[type=tel],#co textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
#co textarea{resize:vertical}
#co .err{border-color:var(--red)}
.rd{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;background:var(--card)}
.rd input{margin-top:4px}.rd small{color:var(--mute)}
.emsg{color:var(--red);font-size:13px;margin:10px 0 4px;min-height:1px}
.row2{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
#ff .tot{margin-top:2px}
.btn.lnk{border:0;background:none;color:var(--mute);padding:6px;font-size:13px;text-decoration:underline}
#done{padding:24px 0;display:grid;gap:10px}
#done p{margin:0 0 6px;line-height:1.5}
.note{font-size:12.5px;color:var(--mute);text-align:center;line-height:1.4}
.fi img{mix-blend-mode:multiply;background:var(--acc2)}
.ph img,.ci .circ img,.pics .a img,.fi img{filter:brightness(1.07) contrast(1.03)}
.thumbs img{background:var(--acc2)}
.act{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.act:empty{display:none}
.ac{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.ac:hover{border-color:var(--cocoa)}
.ac.clr{border:0;background:none;color:var(--cocoa);text-decoration:underline;text-underline-offset:3px}
.pb{position:absolute;top:8px;left:8px;background:var(--cocoa);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;z-index:5;letter-spacing:.03em}
.pnote{font-size:12.5px;color:var(--cocoa);margin-top:2px;font-weight:500}
.pbox{margin:10px 0 2px;padding:10px 12px;border:1px dashed var(--cocoa);border-radius:10px;font-size:14px;line-height:1.4;background:var(--acc2)}
.phint{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--acc2);font-size:13.5px;line-height:1.4;border-left:3px solid var(--camel)}
.phint.got{border-left-color:var(--cocoa);background:#efe3cf}
.zone{font-size:12.5px;color:var(--mute);margin-top:12px;line-height:1.45}
.row2.gift{color:var(--cocoa);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);max-width:min(420px,92vw);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.4;z-index:80;opacity:0;pointer-events:none;transition:.25s;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.pb{top:6px;left:6px;font-size:12px;padding:2px 9px}}
.per{font-size:12.5px;color:var(--mute)}
</style>
</head>
<body>
<div class="site-head">
  <nav class="nav"><a id="navHome">Каталог</a><a id="navSale">Акции</a></nav>
  <div class="logo" id="logo">COIN<span>CASA</span></div>
  <div class="hr"><button id="favBtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="w"> Корзина</span> <b id="favN">0</b></button></div>
</div>
<div class="searchbar"><input id="q" type="search" placeholder="Поиск по названию, артикулу…"></div>
<section id="home">
  <span id="homeSub" hidden></span>
  <div class="bn"><div class="slides" id="slides"></div><div class="dots" id="dots"></div></div>
  <div class="cats" id="catRow"></div>
  <div class="sale" id="saleBox"><h2>Скидки</h2><div class="strip" id="strip"></div></div>
  <div id="sections"></div>
</section>
<div id="veil"></div>
<div id="drawer">
  <header><div class="logo">КОРЗИНА</div><button class="x" style="position:static" onclick="favClose()">×</button></header>
  <div id="fl">
    <div id="cartBody">
      <div id="items"></div>
      <div id="prog"></div>
    </div>
  </div>
  <div id="ff"></div>
</div>
<div class="wrap" hidden>
  <aside id="side">
    <div class="mh"><b>Фильтры</b><button class="x" id="sideX">×</button></div>
    <h4>Категории</h4><div id="cats"></div>

<script src="data.js?v=1792831942"></script>
<script>
const D = window.CATALOG || [];
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';
const ICON = {'Новый год':'🎄','Мебель':'🛋️','Одежда и аксессуары':'🧣','Ванная комната':'🛁','Кухня':'🍳','Сервировка и посуда':'🍽️','Постельное бельё и пледы':'🛏️','Текстиль для интерьера':'🧶','Декор для дома':'🕯️','Сувениры и книги':'📚','Прочее':'📦'};
const WA_NUMBER = '77717400200';   // номер WhatsApp в формате 77001234567; пусто — клиент сам выберет, кому отправить
const PAGE = 48;
let FAV = {};
try { FAV = JSON.parse(localStorage.getItem('cart') || '{}'); } catch(e) {}
const saveFav = () => { try { localStorage.setItem('cart', JSON.stringify(FAV)); } catch(e) {} };
const SHOP = {
  wa: '77717400200',     // корпоративный WhatsApp, куда падают заказы
  freeFrom: 100000       // бесплатная доставка по Алматы от этой суммы, ₸
};
const byId = id => D.find(v => v.id == id);
const S = {cat:'',sub:'',mats:new Set(),countries:new Set(),pmin:null,pmax:null,stock:false,disc:false,p21:false,q:'',sort:'photo',shown:PAGE};
let list = [];
// Акция «2+1»: на каждые 3 товара из одной группы самый недорогой — в подарок.
const CANDLES = new Set(['7477118', '6801839', '6801840', '6801841', '6801842', '6801843', '6801844', '6801845', '6802525', '6802526', '6802527', '6802528', '6802529', '6802530', '6802531', '6802532', '6802533', '7456620', '7456640', '7456641', '7456642', '7456655', '7456658', '7456659', '7456660', '7456661', '7456662', '7456663', '7456664', '7456665', '7456666', '7456667', '7456668', '7456669', '7456670', '7456671', '7456672', '7456673', '7456674', '7456675', '7456676', '7456677', '7456678', '7456679', '7456680', '7456681', '7456682', '7456683', '7456684', '7456685', '7456686', '7456691', '7456692', '7456693', '7456695', '7456696', '7456697', '7456698', '7457994', '7457995', '7457996', '7457997', '7457998', '7457999', '7458000', '7458001', '7458002', '7458003', '7458004', '7458005', '7458006', '7458007', '7458008', '7458009', '7458010', '7458011', '61359740', '6100092A700', '6100093A774', '6100094A774', '6100095A774']);
const PROMOS = [
  {id:'candles',   name:'свечи',           test:x=>CANDLES.has(x.sku)},
  {id:'placemats', name:'плейсматы',       test:x=>/плейс|плейм|ланчмат/i.test(x.n)},
  {id:'toys',      name:'ёлочные игрушки', test:x=>x.s==='Ёлочные украшения'},
  {id:'pillows',   name:'подушки',         test:x=>x.s==='Декоративные подушки'&&/подушк/i.test(x.n)}
];
// Эти артикулы НЕ участвуют в акции 2+1 (но остаются в каталоге).
const NO_PROMO = new Set(['7457282', '7457279', '7457376', '7458001', '7457185', '7280904', '6682560', '7459615', '7461854', '7456620', '7457999', '7461574', '7461580', '7280903', '7377968', '7377969', '7457183', '7457998', '7457393', '7461598', '7461848', '7459596', '7457372', '7456640', '7457371', '7461851', '7457274', '6682561']);
D.forEach(x=>{const p=NO_PROMO.has(x.sku)?null:PROMOS.find(p=>p.test(x));x.pr=p?p.id:''});
// У этих артикулов на фото несколько штук/набор — показываем одно фото, чтобы не думали, что цена за весь набор.
const ONE_PHOTO = {'7457205':1,'7457403':0,'7457369':0,'7461624':1,'7458008':0,'7458009':0,'7461576':0,'7457362':0,'7459424':1};   // артикул: номер оставляемого фото (0 — первое)
D.forEach(x=>{ if(x.sku in ONE_PHOTO && x.ph.length>1) x.ph=[x.ph[ONE_PHOTO[x.sku]]||x.ph[0]]; });
const unitOf = x => /набор|комплект|\bset\b/i.test(x.n) ? 'за 1 набор' : 'за 1 шт.';
const promoName = id => (PROMOS.find(p=>p.id===id)||{}).name||'';

const ORDER = Object.keys(ICON);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function match(x, skip){
  if (skip!=='cat' && S.cat && x.c!==S.cat) return false;
  if (skip!=='cat' && S.sub && x.s!==S.sub) return false;
  if (skip!=='mat' && S.mats.size && !x.m.some(m=>S.mats.has(m))) return false;
  if (skip!=='co' && S.countries.size && !S.countries.has(x.co)) return false;
  if (S.pmin!=null && x.p < S.pmin) return false;
  if (S.pmax!=null && x.p > S.pmax) return false;
  if (S.stock && x.q<=0) return false;
  if (S.disc && !(x.o||x.pr)) return false;
  if (S.p21 && !x.pr) return false;
  if (S.q){
    const h=(x.n+' '+x.i+' '+x.sku+' '+x.mt+' '+x.s).toLowerCase();
    if (!S.q.split(/\s+/).every(w=>h.includes(w))) return false;
  }
  return true;
}

const OPEN = new Set();
function renderCats(){
  const base = D.filter(x=>match(x,'cat'));
  const byCat = {}, bySub = {};
  base.forEach(x=>{byCat[x.c]=(byCat[x.c]||0)+1;(bySub[x.c]??={})[x.s]=(bySub[x.c][x.s]||0)+1});
  let h = `<div class="cat ${!S.cat?'on':''}" data-c=""><span class="chv"></span><span class="cn">Все товары</span><small>${base.length}</small></div>`;
  ORDER.filter(c=>byCat[c]).forEach(c=>{
    const open = OPEN.has(c), subs = Object.keys(bySub[c]).length > 1;
    h += `<div class="cat ${S.cat===c&&!S.sub?'on':''}" data-c="${esc(c)}"><span class="chv ${subs?'tg':''}" ${subs?`data-t="${esc(c)}"`:''}>${subs?(open?'▾':'▸'):''}</span><span class="cn">${c}</span><small>${byCat[c]}</small></div>`;
    if (open && subs) Object.entries(bySub[c]).sort((a,b)=>b[1]-a[1]).forEach(([s,n])=>{
      h += `<div class="cat sub ${S.sub===s&&S.cat===c?'on':''}" data-c="${esc(c)}" data-s="${esc(s)}"><span class="chv"></span><span class="cn">${s}</span><small>${n}</small></div>`;
    });
  });
  $('#cats').innerHTML = h;
}

function renderChips(id, key, skip, set){
  const cnt = {};
  D.filter(x=>match(x,skip)).forEach(x=>{(key==='m'?x.m:[x.co]).forEach(v=>{if(v)cnt[v]=(cnt[v]||0)+1})});
  set.forEach(v=>{if(!cnt[v])cnt[v]=0});
  $(id).innerHTML = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([v,n])=>
    `<span class="chip ${set.has(v)?'on':''}" data-v="${esc(v)}">${v} ${n}</span>`).join('');
}

function card(x){
  const ph = x.ph.length ? `<img loading="lazy" src="${x.ph[0]}" alt="" onerror="this.remove()">` : '';
  return `<div class="card" data-id="${x.id}">
    <div class="ph ${x.ph.length?'has':''}">${x.o?`<span class="badge">−${Math.round((x.o-x.p)/x.o*100)}%</span>`:''}${x.pr?'<span class="pb">2+1</span>':''}${ph}<span>COINCASA</span></div>
    <div class="body"><div class="nm">${esc(x.n)}</div>
    <div class="it">${esc(x.i||x.s)}</div>
    <div class="pr"><b>${fmt(x.p)}</b>${x.o?`<s>${fmt(x.o)}</s>`:''}<span class="per">${unitOf(x)}</span></div>${x.pr?'<div class="pnote">Акция 2+1: третий в подарок</div>':''}
    <div class="st ${x.q>0?'':'no'}">${x.q>0?'В наличии':'Нет в наличии'}</div><div class="addbox" data-id="${x.id}">${addHtml(x.id)}</div></div></div>`;
}

const COVER = {'Текстиль для интерьера':'7458214','Ванная комната':'7456872','Декор для дома':'7476092','Постельное бельё и пледы':'7499953','Сервировка и посуда':'7232330','Кухня':'7377916','Новый год':'7459612','Мебель':'7429602'};
function preview(c, n){
  const seen={}, out=[];
  D.filter(x=>x.c===c&&x.ph.length&&x.q>0).sort((a,b)=>b.ph.length-a.ph.length).forEach(x=>{
    if((seen[x.n]=(seen[x.n]||0)+1)<=2 && out.length<n) out.push(x);
  });
  return out;
}
let bnTimer;
function promoPics(){
  const out=[];
  PROMOS.forEach(p=>{const x=D.find(x=>x.pr===p.id&&x.ph.length&&x.q>0); if(x)out.push(x)});
  return out.slice(0,3);
}
function renderBanner(){
  const maxD = Math.max(...D.map(x=>x.o?Math.round((x.o-x.p)/x.o*100):0));
  const sale = D.filter(x=>x.o&&x.ph.length&&x.q>0).sort((a,b)=>(b.o-b.p)/b.o-(a.o-a.p)/a.o);
  const S1=[
    {k:'Акции',t:`Скидки до ${Math.floor(maxD/5)*5}%`,p:'Выгодные цены на посуду, текстиль и декор. Количество ограничено.',b:'Смотреть акции',act:'sale',c:['#f3e6d5','#e2c9a8'],items:sale.slice(0,3)},
    {k:'Акция',t:'2+1',p:'Купите три — самый недорогой в подарок: свечи, плейсматы, ёлочные игрушки и подушки.',b:'Смотреть акцию',act:'p21',c:['#efe2cf','#d9bf9b'],items:promoPics()},
    {k:'Сезон',t:'Новый год',p:'Ёлочные украшения, гирлянды и праздничный декор для дома.',b:'Смотреть коллекцию',cat:'Новый год',c:['#efdfd3','#d6b5a0'],items:preview('Новый год',3)},
    {k:'Коллекция',t:'Сервировка',p:'Скатерти, посуда и салфетки для красивого стола.',b:'Смотреть коллекцию',cat:'Сервировка и посуда',c:['#ece3d2','#d0bf9f'],items:preview('Сервировка и посуда',3)}
  ];
  $('#slides').innerHTML=S1.map(s=>`<div class="slide" style="--b1:${s.c[0]};--b2:${s.c[1]}"><div class="tx"><small>${s.k}</small><h2>${s.t}</h2><p>${s.p}</p><a class="go" ${s.act?`data-act="${s.act}"`:`data-book="${esc(s.cat)}"`}>${s.b}</a></div><div class="pics">${s.items.map(x=>`<div class="a"><img src="${x.ph[0]}" alt=""></div>`).join('')}</div></div>`).join('');
  $('#dots').innerHTML=S1.map((_,i)=>`<i data-d="${i}" class="${i?'':'on'}"></i>`).join('');
  const sl=$('#slides'), go=i=>sl.scrollTo({left:sl.clientWidth*i,behavior:'smooth'});
  sl.onscroll=()=>{const i=Math.round(sl.scrollLeft/sl.clientWidth);document.querySelectorAll('#dots i').forEach((d,j)=>d.classList.toggle('on',i===j))};
  $('#dots').onclick=e=>{const d=e.target.closest('i');if(d)go(+d.dataset.d)};
  const tick=()=>{if(document.hidden||$('#home').hidden)return;go((Math.round(sl.scrollLeft/sl.clientWidth)+1)%S1.length)};
  clearInterval(bnTimer);bnTimer=setInterval(tick,6000);
  ['mouseenter','touchstart'].forEach(ev=>sl.addEventListener(ev,()=>clearInterval(bnTimer),{passive:true}));
}
function renderHome(){
  renderBanner();
  const cnt={}; D.forEach(x=>cnt[x.c]=(cnt[x.c]||0)+1);
  const cats = ORDER.filter(c=>cnt[c]);
  $('#homeSub').textContent = `${D.length} товаров`;
  $('#catRow').innerHTML = cats.map(c=>{
    const it = D.find(x=>x.sku===COVER[c]&&x.ph.length) || D.find(x=>x.c===c&&x.ph.length);
    return `<div class="ci" data-book="${esc(c)}"><div class="circ">${it?`<img src="${it.ph[0]}" alt="">`:''}</div><span>${c}</span></div>`;
  }).join('');
  const sale = D.filter(x=>x.o&&x.ph.length&&x.q>0).sort((a,b)=>(b.o-b.p)/b.o-(a.o-a.p)/a.o).slice(0,14);
  $('#saleBox').hidden = !sale.length;
  $('#strip').innerHTML = sale.map(card).join('');
  $('#sections').innerHTML = cats.map(c=>`<div class="sec"><div class="sh"><h2>${c}</h2><a class="all" data-book="${esc(c)}">Смотреть все ${cnt[c]} →</a></div><div class="strip">${preview(c,10).map(card).join('')}</div></div>`).join('');
}
function goHome(){
  Object.assign(S,{cat:'',sub:'',pmin:null,pmax:null,stock:false,disc:false,p21:false,q:'',home:true});
  S.mats.clear();S.countries.clear();
  ['#q','#pmin','#pmax'].forEach(i=>$(i).value='');$('#fStock').checked=false;$('#fDisc').checked=false;$('#fP21').checked=false;
  $('#home').hidden=false;$('.wrap').hidden=true;$('#fab').hidden=true;$('#side').classList.remove('on');window.scrollTo(0,0);
}
function apply(){
  S.home=false;$('#home').hidden=true;$('.wrap').hidden=false;$('#fab').hidden=false;
  list = D.filter(x=>match(x));
  const so = {photo:(a,b)=>(b.ph.length>0)-(a.ph.length>0), pa:(a,b)=>a.p-b.p, pd:(a,b)=>b.p-a.p, name:(a,b)=>a.n.localeCompare(b.n,'ru'),
    disc:(a,b)=>(b.o?b.o-b.p:0)/(b.o||1)-(a.o?a.o-a.p:0)/(a.o||1)};
  if (so[S.sort]) list.sort(so[S.sort]);
  list.sort((a,b)=>(b.q>0)-(a.q>0));            // нет в наличии — в конец
  list.sort((a,b)=>(b.ph.length>0)-(a.ph.length>0)); // товары с фото всегда выше (сортировка устойчивая)
  S.shown = PAGE; draw(); renderCats();
  renderChips('#mats','m','mat',S.mats); renderChips('#countries','co','co',S.countries);
}

function renderActive(){
  const a=[];
  if(S.disc)a.push(['disc','Акции и скидки']);
  if(S.p21)a.push(['p21','Акция 2+1']);
  if(S.stock)a.push(['stock','Только в наличии']);
  S.mats.forEach(m=>a.push(['mat:'+m,m]));
  S.countries.forEach(c=>a.push(['co:'+c,c]));
  if(S.pmin!=null||S.pmax!=null)a.push(['price','Цена '+(S.pmin??0)+'–'+(S.pmax??'∞')+' ₸']);
  if(S.q)a.push(['q','Поиск: '+S.q]);
  $('#act').innerHTML=a.length?a.map(([k,t])=>`<button class="ac" data-ac="${esc(k)}">${esc(t)} ×</button>`).join('')+'<button class="ac clr" data-ac="all">Показать все товары</button>':'';
}
function draw(){
  renderActive();
  $('#showRes').textContent = `Показать ${list.length} товаров`;
  $('#grid').innerHTML = list.slice(0,S.shown).map(card).join('') || '<div class="empty">Ничего не найдено. Попробуйте сбросить фильтры.</div>';
  $('#more').style.display = list.length>S.shown ? 'block':'none';
  $('#more').textContent = `Показать ещё (${list.length-S.shown})`;
  $('#crumb').innerHTML = `${S.cat?`<b>${S.cat}</b>${S.sub?' / '+S.sub:''} · `:''}${list.length} товаров`;
}

function open_(id){
  const x = D.find(v=>v.id==id); if(!x) return;
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  $('#mbox').innerHTML = `<button class="x mx" onclick="closeM()">×</button><div class="ph ${x.ph.length?'has':''}">${x.ph.length?`<img id="big" src="${x.ph[0]}" alt="">`:''}${x.ph.length>1?`<div class="thumbs">${x.ph.map((p,i)=>`<img class="${i?'':'on'}" src="${p}" onclick="pick(this)" alt="">`).join('')}</div>`:''}<span>COINCASA</span></div>
  <div class="mi"><button class="x" onclick="closeM()">×</button>
  <h2>${esc(x.n)}</h2><div class="it" style="white-space:normal">${esc(x.i)}</div>
  <div class="pr" style="margin-top:14px"><span class="big">${fmt(x.p)}</span><span class="per">цена ${unitOf(x)}</span>${x.o?`<s>${fmt(x.o)}</s><span class="badge" style="position:static">−${Math.round((x.o-x.p)/x.o*100)}%</span>`:''}</div>
  ${x.pr?`<div class="pbox"><b>Акция 2+1</b><br>Купите 3 товара из акции «${promoName(x.pr)}» — самый недорогой будет в подарок. Подарок добавится в корзине автоматически.</div>`:''}
  <div class="st ${x.q>0?'':'no'}">${x.q>0?'В наличии: '+x.q+' шт.':'Нет в наличии'}</div>
  <div class="addbox" data-id="${x.id}" style="margin:12px 0 4px">${addHtml(x.id)}</div>
  <dl>${row('Артикул',x.sku)}${row('Категория',x.c+' / '+x.s)}${row('Состав',x.mt)}${row('Страна',x.co)}${row('Размер',x.sz)}${row('Цвет',x.col)}</dl></div>`;
  $('#modal').classList.add('on');
}
function pick(el){$('#big').src=el.src;el.parentElement.querySelectorAll('img').forEach(i=>i.classList.toggle('on',i===el))}
function closeM(){$('#modal').classList.remove('on')}

const maxQty = id => { const x=byId(id); return x?Math.max(0,x.q):0 };
function addHtml(id){
  const x=byId(id), n=FAV[id]||0;
  if(!x||x.q<=0) return '<button class="add" disabled>Нет в наличии</button>';
  if(!n) return `<button class="add" data-add="${id}">В корзину</button>`;
  return `<div class="stp"><button data-dec="${id}" aria-label="Меньше">−</button><b>${n}</b><button data-inc="${id}" aria-label="Больше" ${n>=x.q?'disabled':''}>+</button></div>`;
}
const cartCount = () => Object.values(FAV).reduce((s,n)=>s+n,0);
let toastT;
function toast(msg){
  let t=$('#toast'); if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
  t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),4200);
}
function cartSet(id,n){
  const prev=FAV[id]||0;
  n=Math.min(n,maxQty(id)); if(n<=0) delete FAV[id]; else FAV[id]=n;
  saveFav(); favUpdate(); const open=$('#drawer').classList.contains('on'); if(open) cartRender();
  const x=byId(id);
  if(!open&&x&&x.pr&&n>prev){
    const r=promoCalc().find(r=>r.p.id===x.pr), rem=r.units%3;
    toast(rem===0?`Акция 2+1: ${r.free} в подарок (${promoName(x.pr)}). Подарок добавится в корзине`:`Акция 2+1 (${promoName(x.pr)}): добавьте ещё ${3-rem} — самый недорогой будет в подарок`);
  }
}
function favUpdate(){
  $('#favN').textContent = cartCount();
  document.querySelectorAll('.addbox').forEach(b=>b.innerHTML=addHtml(b.dataset.id));
}
function promoCalc(){
  const out=[];
  PROMOS.forEach(p=>{
    const u=[]; Object.entries(FAV).forEach(([id,n])=>{const x=byId(id);if(x&&x.pr===p.id)for(let i=0;i<n;i++)u.push(x)});
    if(!u.length)return;
    u.sort((a,b)=>a.p-b.p);                         // самые дешёвые — первыми
    const free=Math.floor(u.length/3), gift=u.slice(0,free);
    out.push({p,units:u.length,free,gift,disc:gift.reduce((s,x)=>s+x.p,0)});
  });
  return out;
}
function cartCalc(){
  let sub=0; Object.entries(FAV).forEach(([id,n])=>{const x=byId(id); if(x) sub+=x.p*n});
  const pr=promoCalc(), disc=pr.reduce((s,r)=>s+r.disc,0), total=sub-disc;
  return {sub,pr,disc,total,free:total>=SHOP.freeFrom};
}
const ZONE='Стандартная зона доставки: Достык – Райымбека – Саина – Аль-Фараби';
function orderText(c){
  const lines=Object.entries(FAV).map(([id,n],i)=>{const x=byId(id);if(!x)return'';
    const nm=x.i&&x.i.toLowerCase().includes(x.n.toLowerCase())?x.i:x.n+(x.i?' '+x.i:'');
    return `${i+1}. ${nm} (арт. ${x.sku}) — ${n} шт × ${fmt(x.p)} = ${fmt(x.p*n)}${x.pr?' [акция 2+1]':''}`}).filter(Boolean);
  const promo=c.pr.filter(r=>r.disc>0).map(r=>`Акция 2+1 (${r.p.name}): в подарок ${r.free} шт. — −${fmt(r.disc)}`);
  return ['Здравствуйте! Хочу заказать:','',...lines,'',
    ...(c.disc>0?[`Товары: ${fmt(c.sub)}`,...promo]:[]),
    `Итого: ${fmt(c.total)}`,
    `Доставка по Алматы: ${c.free?'бесплатно':'стоимость уточнит менеджер'}`,ZONE,'',
    'Имя и фамилия: ','Адрес доставки: ','Оплата (наличными или картой): '].join('\n');
}
function promoHints(c){
  return c.pr.map(r=>{
    const rem=r.units%3, need=rem===0?3:3-rem;
    const t = r.free
      ? `В подарок: ${r.free} шт. — вы экономите <b>${fmt(r.disc)}</b>. Добавьте ещё ${need} из этой акции — получите ещё один подарок.`
      : `Добавьте ещё ${need} из этой акции — и самый недорогой будет в подарок.`;
    return `<div class="phint${r.free?' got':''}"><b>Акция 2+1 · ${esc(r.p.name)}</b><br>${t}</div>`;
  }).join('');
}
function cartRender(){
  const ids=Object.keys(FAV).filter(id=>byId(id));
  $('#ff').hidden=!ids.length;
  $('#items').innerHTML = ids.length ? ids.map(id=>{const x=byId(id);const n=FAV[id];
    return `<div class="fi"><div>${x.ph.length?`<img src="${x.ph[0]}" alt="">`:'<div class="nop"></div>'}</div>
    <div><div class="t">${esc(x.n)}</div><div class="s">${esc(x.i||'')} · арт. ${esc(x.sku)}</div>
    <div class="qty"><button data-dec="${id}">−</button><b>${n}</b><button data-inc="${id}" ${n>=x.q?'disabled':''}>+</button><span class="s">${fmt(x.p)} × ${n} = <b>${fmt(x.p*n)}</b></span></div></div>
    <button class="rm" data-rm="${id}" title="Убрать">×</button></div>`}).join('')
    : '<div class="empty">Корзина пуста.<br>Нажмите «В корзину» у товара.</div>';
  const c=cartCalc();
  $('#prog').innerHTML = !ids.length ? '' : promoHints(c) + (c.free
    ? '<div class="pgt okk">Доставка по Алматы бесплатная</div><div class="pg"><i style="width:100%"></i></div>'
    : `<div class="pgt">Добавьте товаров ещё на <b>${fmt(SHOP.freeFrom-c.total)}</b> — доставка по Алматы будет бесплатной</div><div class="pg"><i style="width:${Math.min(100,c.total/SHOP.freeFrom*100)}%"></i></div>`) + `<div class="zone">Бесплатная доставка по Алматы от ${fmt(SHOP.freeFrom)}.<br>${ZONE}.</div>`;
  if(!ids.length){$('#ff').innerHTML='';return}
  const text=orderText(c); let url='https://wa.me/'+SHOP.wa+'?text='+encodeURIComponent(text), long=false;
  if(url.length>3800){long=true;url='https://wa.me/'+SHOP.wa}
  $('#ff').innerHTML = `${c.disc>0?`<div class="row2"><span>Товары</span><span>${fmt(c.sub)}</span></div><div class="row2 gift"><span>Акция 2+1 — подарок</span><span>−${fmt(c.disc)}</span></div>`:''}<div class="tot"><span>Итого</span><b>${fmt(c.total)}</b></div>
    <div class="row2"><span>Доставка по Алматы</span><span>${c.free?'бесплатно':'бесплатно от '+fmt(SHOP.freeFrom)}</span></div>
    <a class="btn main" id="sendOrder" ${long?'data-long="1"':''} href="${url}" target="_blank" rel="noopener">Отправить заказ в WhatsApp</a>
    <div class="note">${long?'Список длинный — он скопируется, вставьте его в чат.':'Откроется чат со списком — допишите имя и адрес и нажмите «Отправить».'}</div>
    <button class="btn lnk" id="clrCart">Очистить корзину</button>`;
  ORDER_TEXT=text;
}
let ORDER_TEXT='';
function favOpen(){cartRender();$('#drawer').classList.add('on');$('#veil').classList.add('on')}
function favClose(){$('#drawer').classList.remove('on');$('#veil').classList.remove('on')}
document.addEventListener('click',e=>{
  const bk=e.target.closest('[data-book]'); if(bk){S.cat=bk.dataset.book;S.sub='';OPEN.add(S.cat);apply();window.scrollTo(0,0);return}
  const ac=e.target.closest('[data-act="sale"]'); if(ac){$('#navSale').click();return}
  const a21=e.target.closest('[data-act="p21"]'); if(a21){goHome();S.p21=true;$('#fP21').checked=true;apply();window.scrollTo(0,0);return}
  if(e.target.closest('#logo,#navHome')){goHome();return}
  if(e.target.closest('#navSale')){goHome();S.disc=true;S.sort='disc';$('#fDisc').checked=true;$('#sort').value='disc';apply();window.scrollTo(0,0);return}
  const ac2=e.target.closest('[data-ac]'); if(ac2){const k=ac2.dataset.ac;
    if(k==='all'){S.cat='';S.sub='';S.disc=false;S.p21=false;$('#fP21').checked=false;S.stock=false;S.q='';S.pmin=S.pmax=null;S.mats.clear();S.countries.clear();['#q','#pmin','#pmax'].forEach(i=>$(i).value='');$('#fDisc').checked=false;$('#fStock').checked=false}
    else if(k==='disc'){S.disc=false;$('#fDisc').checked=false}
    else if(k==='p21'){S.p21=false;$('#fP21').checked=false}
    else if(k==='stock'){S.stock=false;$('#fStock').checked=false}
    else if(k==='price'){S.pmin=S.pmax=null;$('#pmin').value='';$('#pmax').value=''}
    else if(k==='q'){S.q='';$('#q').value=''}
    else if(k.startsWith('mat:'))S.mats.delete(k.slice(4));
    else if(k.startsWith('co:'))S.countries.delete(k.slice(3));
    apply();return}
  const ad=e.target.closest('[data-add]'); if(ad){e.stopPropagation();cartSet(ad.dataset.add,1);return}
  const ic=e.target.closest('[data-inc]'); if(ic){cartSet(ic.dataset.inc,(FAV[ic.dataset.inc]||0)+1);return}
  const dc=e.target.closest('[data-dec]'); if(dc){cartSet(dc.dataset.dec,(FAV[dc.dataset.dec]||0)-1);return}
  const rm=e.target.closest('[data-rm]'); if(rm){cartSet(rm.dataset.rm,0);return}
  if(e.target.closest('.addbox')) return;
  if(e.target.id==='clrCart'){FAV={};saveFav();favUpdate();cartRender();return}
  if(e.target.id==='sendOrder'&&e.target.dataset.long){try{navigator.clipboard.writeText(ORDER_TEXT)}catch(x){}return}
  if(e.target.id==='veil'){favClose();return}

  const tg=e.target.closest('[data-t]'); if(tg){const k=tg.dataset.t;OPEN.has(k)?OPEN.delete(k):OPEN.add(k);renderCats();return}
  const c=e.target.closest('.cat'); if(c){S.cat=c.dataset.c;S.sub=c.dataset.s||'';if(S.cat&&!S.sub)OPEN.add(S.cat);apply();if(innerWidth<=820)$('#side').classList.remove('on');return}
  const ch=e.target.closest('.chip[data-v]'); if(ch){const set=ch.parentElement.id==='mats'?S.mats:S.countries;const v=ch.dataset.v;set.has(v)?set.delete(v):set.add(v);apply();return}
  const cd=e.target.closest('.card'); if(cd){open_(cd.dataset.id);return}
  if(e.target.id==='modal')closeM();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
$('#favBtn').onclick=favOpen;
$('#more').onclick=()=>{S.shown+=PAGE;draw()};
$('#fab').onclick=()=>$('#side').classList.add('on');
$('#sideX').onclick=$('#showRes').onclick=()=>{$('#side').classList.remove('on');window.scrollTo(0,0)};
let t; $('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{S.q=e.target.value.trim().toLowerCase();apply()},200)};
$('#sort').onchange=e=>{S.sort=e.target.value;apply()};
$('#pmin').oninput=e=>{S.pmin=e.target.value===''?null:+e.target.value;apply()};
$('#pmax').oninput=e=>{S.pmax=e.target.value===''?null:+e.target.value;apply()};
$('#fStock').onchange=e=>{S.stock=e.target.checked;apply()};
$('#fDisc').onchange=e=>{S.disc=e.target.checked;apply()};
$('#fP21').onchange=e=>{S.p21=e.target.checked;apply()};
$('#reset').onclick=()=>{Object.assign(S,{cat:'',sub:'',pmin:null,pmax:null,stock:false,disc:false,p21:false,q:''});S.mats.clear();S.countries.clear();
  ['#q','#pmin','#pmax'].forEach(i=>$(i).value='');$('#fStock').checked=false;$('#fDisc').checked=false;$('#fP21').checked=false;apply()};
renderHome();apply();goHome();favUpdate();
</script>
</body>
</html>
